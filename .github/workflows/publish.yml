# Econpilot 사이트 배포 — 공개 소스를 받아 빌드하고 이 레포의 Pages 로 배포.
# 토큰·시크릿 불필요 (자기 레포 배포에 쓰는 GITHUB_TOKEN 만 사용).
# 사전 설정: Settings → Pages → Source 를 "GitHub Actions" 로 지정.

name: Publish site

on:
  schedule:
    # 하루 세 번: 08:00 · 12:00 · 18:00 KST (= 23:00 · 03:00 · 09:00 UTC).
    # 소스 레포의 일일 수집(07:00 KST 예약)을 GitHub 가 몇 시간씩 늦게 돌리는 날이 있어,
    # 08:00 한 번만 배포하면 그날 데이터(특히 FOMC 다음 날)가 하루 늦게 뜬다 — 2026-10-29 실제 발생.
    # 늦게 끝난 수집도 몇 시간 안에 사이트에 반영되도록 배포를 여러 번 돈다.
    - cron: "0 23,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SRC_REPO: https://github.com/2026-AICP/fomc-sentiment-agents.git
      SRC_BRANCH: deploy/streamlit-dashboard
    steps:
      - name: Fetch site source (public repo)
        run: git clone --depth 1 --branch "$SRC_BRANCH" "$SRC_REPO" src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: src/dashboard-web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Verify build output
        working-directory: src/dashboard-web
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 없음 — 빌드 실패"; exit 1; }
          n=$(ls dist/data/*.json 2>/dev/null | wc -l)
          echo "데이터 JSON ${n}개"
          [ "$n" -gt 0 ] || { echo "::error::dist/data 에 JSON 없음"; exit 1; }
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/dashboard-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub 는 60일 동안 커밋이 없는 저장소의 예약 실행(schedule)을 자동으로 끈다.
  # 이 저장소는 배포만 하고 커밋이 거의 없어 2026-10-07 에 실제로 꺼졌다(disabled_inactivity).
  # 마지막 커밋이 30일 넘게 지났으면 빈 커밋을 하나 남겨 '활동 중' 상태를 유지한다.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Empty commit if idle for 30+ days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "마지막 커밋 ${age_days}일 전"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — 예약 배포가 비활성으로 꺼지지 않게"
            git push
          fi
